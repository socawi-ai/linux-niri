[notification]
background_opacity = 0.48999998904764652

[osd]
background_opacity = 0.4999999888241291

[shell]
panel_anchor_bar = "default"
polkit_agent = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[widget.workspaces]
label_source = "name"
