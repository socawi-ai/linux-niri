[dock]
background_opacity = 0.64999998547136784
concave_edge_corners = false
enabled = true
icon_size = 30
launcher_position = "start"
magnification_scale = 1.0
main_axis_padding = 13
margin_edge = 8
show_dots = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
